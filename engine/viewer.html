<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THIS WAY — live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  :root{
    --bg:#07090c; --ink:#e8e6e1; --dim:#7d8590;
    --amber:#e0a355; --teal:#2f6f76; --line:#1b2026;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:15px;letter-spacing:.28em;text-transform:uppercase;
     font-weight:500;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  video{width:100%;aspect-ratio:2.39/1;background:#000;display:block;
        border:1px solid var(--line)}
  #unmute{display:block;width:100%;text-align:center;padding:13px;
    background:var(--amber);color:#0b0d10;font-weight:600;letter-spacing:.06em;
    border:none;cursor:pointer;touch-action:manipulation}
  #unmute.hide{display:none}
  .bar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;
       padding:10px 12px;border:1px solid var(--line);border-top:none;
       font-size:12px;color:var(--dim)}
  .bar b{color:var(--ink);font-weight:500}
  .dot{width:7px;height:7px;border-radius:50%;background:#3b4149;
       display:inline-block;margin-right:6px}
  .dot.on{background:var(--amber);box-shadow:0 0 8px var(--amber)}

  .vote{margin-top:22px;border:1px solid var(--line);padding:16px;
        opacity:.35;transition:opacity .3s}
  .vote.live{opacity:1;border-color:var(--teal)}
  .vote h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
           color:var(--dim);margin:0 0 12px;font-weight:500}
  .opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media(max-width:680px){.opts{grid-template-columns:1fr}}
  button{all:unset;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:14px 16px;border:1px solid var(--line);
         background:#0c1014;transition:.15s;position:relative;overflow:hidden}
  button:hover:not(:disabled){border-color:var(--amber)}
  button:disabled{cursor:default;opacity:.5}
  button.mine{border-color:var(--amber)}
  .fill{position:absolute;inset:0;background:var(--teal);opacity:.22;
        width:0;transition:width .4s}
  .lbl{position:relative;display:flex;justify-content:space-between;gap:12px}
  .pct{color:var(--dim);font-variant-numeric:tabular-nums}
  .clock{font-size:26px;color:var(--amber);font-variant-numeric:tabular-nums;
         margin-bottom:10px}
  .log{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  .log h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
          color:var(--dim);margin:0 0 10px;font-weight:500}
  .row{display:flex;gap:14px;padding:5px 0;font-size:12px;color:var(--dim);
       border-bottom:1px solid #10141a}
  .row b{color:var(--ink);font-weight:500;min-width:130px}
</style>
</head>
<body>
<div class="wrap">
  <h1>This Way</h1>
  <div class="sub" id="sub">connecting…</div>

  <video id="v" playsinline muted autoplay></video>
  <button id="unmute">Tap for sound</button>
  <div class="bar">
    <span><span class="dot" id="dot"></span><b id="status">offline</b></span>
    <span>playhead <b id="ph">0.0s</b></span>
    <span>buffer <b id="buf">0.0s</b></span>
    <span>watching <b id="viewers">0</b></span>
    <span>beat <b id="beat">—</b></span>
    <span>video <b id="pstat">starting…</b></span>
  </div>

  <div class="vote" id="vote">
    <h2>The audience decides</h2>
    <div class="clock" id="clock">—</div>
    <div class="opts" id="opts"></div>
  </div>

  <div class="log">
    <h2>Canon</h2>
    <div id="canon"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let mine = null, lastBeat = null;

// ---- playback -------------------------------------------------------
// The server owns the playhead, but correcting toward it must be RARE. The
// previous version seeked whenever drift exceeded 2s, and state arrives twice
// a second — so the player seeked, began buffering, got another push, and
// seeked again before a frame ever rendered. A seek loop looks exactly like
// "no video at all".
//
// Now: never seek during startup, allow a wide tolerance, and rate-limit
// corrections to once every 10s. Drift of a few seconds is invisible to an
// audience; a stalled player is not.
const video = $('v');
// Everything is derived from the page's own URL so the app can be mounted at
// any prefix (https://host/thisway/) behind a reverse proxy or CDN without a
// rebuild. An absolute '/stream/...' would break the moment it is not at root.
const BASE = location.pathname.replace(/\/[^/]*$/, '/');
const SRC = BASE + 'stream/master.m3u8';   // ABR ladder: low / mid / high
let started = false, lastSeek = 0;

video.addEventListener('playing', () => { started = true; note('playing'); });
video.addEventListener('waiting', () => note('buffering'));
video.addEventListener('error',   () => note('video error'));

function note(t){ const e=$('pstat'); if(e) e.textContent=t; }

if (Hls.isSupported()) {
  // Desktop and Android: hls.js over Media Source Extensions.
  const hls = new Hls({ enableWorker: true, backBufferLength: 30 });
  hls.loadSource(SRC);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    note('manifest ok');
    video.play().catch(e => note('autoplay blocked — tap to play'));
  });
  hls.on(Hls.Events.ERROR, (_, d) => {
    note('hls: ' + d.details);
    if (!d.fatal) return;
    // The playlist grows as clips render, so early 404s and gaps are normal.
    if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
    else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
  });
} else {
  // iOS Safari has no MSE for this: it plays HLS natively from src.
  video.src = SRC;
  note('native hls');
  video.play().catch(() => note('tap to play'));
}

// Autoplay is only permitted while muted, so the stream starts silent and one
// deliberate tap turns the sound on. This is a browser policy, not a bug: an
// unmuted autoplay is blocked outright, which would mean no picture either.
const unmute = $('unmute');
unmute.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  video.muted = false;
  video.volume = 1;
  video.play().catch(()=>{});
  unmute.classList.add('hide');
});

// A tap anywhere also starts playback if autoplay was blocked entirely.
document.body.addEventListener('click', () => {
  if (video.paused) video.play().catch(()=>{});
});

// ---- state ----------------------------------------------------------
// A stable viewer token, minted once and kept in localStorage, so a refresh
// or reconnect does not become a second ballot. Identity used to be the
// server-side id() of the websocket — a recycled memory address.
let ws;
(async () => {
  let tok = localStorage.getItem('thisway_token');
  if (!tok) {
    try {
      tok = (await (await fetch(BASE + 'token')).json()).token;
      localStorage.setItem('thisway_token', tok);
    } catch (_) { tok = ''; }
  }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}${BASE}live?token=${encodeURIComponent(tok||'')}`);
  wire(ws);
})();

function wire(ws) {

ws.onopen  = () => { $('dot').classList.add('on'); $('status').textContent='live'; };
ws.onclose = () => { $('dot').classList.remove('on'); $('status').textContent='ended'; };

ws.onmessage = e => {
  const s = JSON.parse(e.data);
  if (s.type === 'vote_ack') return;

  $('sub').textContent = s.title + ' — a film that decides itself';
  $('ph').textContent  = s.playhead.toFixed(1)+'s';
  $('buf').textContent = s.buffer_ahead.toFixed(1)+'s';
  $('viewers').textContent = s.viewers;
  $('beat').textContent = s.beat || '—';

  // Correct drift only once playback is genuinely running, only when far out
  // of sync, and at most once every 10 seconds.
  const now = Date.now();
  if (started && !video.paused && video.readyState >= 3 &&
      now - lastSeek > 10000 && Math.abs(video.currentTime - s.playhead) > 8) {
    lastSeek = now;
    try { video.currentTime = s.playhead; } catch (_) {}
  }

  if (s.beat !== lastBeat) { mine = null; lastBeat = s.beat; }

  const box = $('vote');
  box.classList.toggle('live', s.vote_open);
  $('clock').textContent = s.vote_open ? s.vote_remaining.toFixed(1)+'s' : 'closed';

  // Buttons are built ONCE per beat and then UPDATED in place. Rebuilding
  // innerHTML on every state push (which arrives ~2x/second) destroyed the
  // element mid-tap, so a press landed on a node that no longer existed and
  // the vote was swallowed — the observed "had to press it a few times".
  const total = Object.values(s.tally).reduce((a,b)=>a+b,0) || 1;
  const opts = $('opts');
  if (opts.dataset.beat !== String(s.beat)) {
    opts.dataset.beat = String(s.beat);
    opts.innerHTML = '';
    (s.choices||[]).forEach(c => {
      const b = document.createElement('button');
      b.dataset.choice = c.id;
      b.innerHTML = `<span class="fill"></span>
        <span class="lbl"><span>${c.label}</span><span class="pct"></span></span>`;
      // pointerdown, not click: on touch devices click waits ~300ms for a
      // possible double-tap, which is long enough for the next state push.
      b.addEventListener('pointerdown', ev => {
        ev.preventDefault();
        if (b.disabled) return;
        mine = c.id;
        opts.querySelectorAll('button').forEach(x =>
          x.classList.toggle('mine', x.dataset.choice === c.id));
        ws.send(JSON.stringify({type:'vote', choice:c.id}));
      });
      opts.appendChild(b);
    });
  }
  opts.querySelectorAll('button').forEach(b => {
    const id = b.dataset.choice, n = s.tally[id] || 0;
    const pct = Math.round(n/total*100);
    b.disabled = !s.vote_open;
    b.classList.toggle('mine', mine === id);
    b.querySelector('.fill').style.width = pct + '%';
    b.querySelector('.pct').textContent = `${n} · ${pct}%`;
  });

  $('canon').innerHTML = (s.canon||[]).slice().reverse().map(c =>
    `<div class="row"><b>${c.beat}</b><span>chose ${c.winner}</span>
     <span>${c.voters} voting</span><span>${c.at}s</span></div>`).join('')
    || '<div class="row"><span>nothing decided yet</span></div>';
};
}
</script>
</body>
</html>
